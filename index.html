<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de connaissance — Erreurs VBA / SIFAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00A3A6; --teal-d:#007F82; --teal-l:#E0F5F5;
    --blue:#0057A8; --blue-d:#003D78; --blue-l:#E0EBF7;
    --amber:#B8740A; --amber-l:#FBF0DD;
    --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F4;
    --border:#D7E0E8; --text:#16222E; --muted:#5C7286;
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
    --font-display:'Source Serif 4', serif; --font-body:'Source Sans 3', sans-serif; --font-mono:'DM Mono', monospace;
  }
  body.dark{
    --bg:#0E1620; --surface:#16212E; --surface-2:#1B2836;
    --border:#26384A; --text:#E4ECF2; --muted:#8AA3B8;
    --teal-l:#0D3536; --blue-l:#0E2740; --amber-l:#3A2A0D;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--text); transition:background .25s,color .25s; min-height:100vh;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  button{font-family:inherit; cursor:pointer;}
  textarea,input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  /* ───────── Header ───────── */
  .topbar{
    position:sticky; top:0; z-index:20; background:linear-gradient(155deg, var(--blue) 0%, var(--teal) 100%);
    color:#fff; padding:16px 22px;
  }
  .topbar-inner{max-width:1140px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{width:36px; height:36px; border-radius:9px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center;}
  .brand-mark svg{width:19px; height:19px;}
  .brand-title{font-family:var(--font-display); font-size:16px; font-weight:600; line-height:1.15;}
  .brand-sub{font-size:10.5px; opacity:.82; letter-spacing:.05em;}
  .search-wrap{flex:1; min-width:180px; position:relative;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.7;}
  .search-input{
    width:100%; padding:9px 12px 9px 34px; border-radius:99px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.16); color:#fff; font-size:13px;
  }
  .search-input::placeholder{color:rgba(255,255,255,.75);}
  .search-input:focus{background:rgba(255,255,255,.26);}
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .status-pill{
    font-size:10.5px; font-weight:700; padding:6px 11px; border-radius:99px; background:rgba(255,255,255,.16);
    color:#fff; white-space:nowrap; display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.3);
  }
  .status-dot{width:6px; height:6px; border-radius:50%; background:#fff; flex-shrink:0;}
  .status-dot-grist{background:#5FE0E2;}
  .status-dot-claude{background:#fff;}
  .status-dot-local{background:#CFE0EA;}
  .status-dot-memory{background:#FFC76B;}
  .btn{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:8px 14px;
    border-radius:99px; border:1px solid transparent; transition:filter .15s, background .15s;
  }
  .btn svg{width:14px; height:14px;}
  .btn-light{background:#fff; color:var(--blue-d);}
  .btn-light:hover{filter:brightness(.96);}
  .btn-light:disabled{opacity:.55; cursor:default;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35); flex-shrink:0;
  }
  .icon-btn:hover{background:rgba(255,255,255,.26);}
  .icon-btn svg{width:16px; height:16px;}

  /* ───────── Banner ───────── */
  .banner{
    max-width:1140px; margin:14px auto 0; padding:10px 16px; border-radius:var(--radius-sm);
    background:var(--amber-l); border:1px solid #E0B25A; color:var(--amber); font-size:12.5px;
    display:flex; align-items:flex-start; gap:8px; line-height:1.5;
  }
  .banner svg{width:15px; height:15px; flex-shrink:0; margin-top:1px;}
  .banner.hidden{display:none;}
  .banner.good{background:var(--teal-l); border-color:var(--teal); color:var(--teal-d);}

  /* ───────── Filters ───────── */
  .filters{max-width:1140px; margin:16px auto 0; padding:0 22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .chip-row{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .chip{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--teal);}
  .chip.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  select.statut-filter{
    font-size:12.5px; padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .stats{font-size:11.5px; color:var(--muted); white-space:nowrap;}

  /* ───────── List ───────── */
  .content{max-width:1140px; margin:0 auto; padding:16px 22px 60px;}
  .empty-state{text-align:center; padding:70px 20px; color:var(--muted);}
  .empty-state svg{width:46px; height:46px; opacity:.4; margin-bottom:14px;}
  .empty-state h2{font-family:var(--font-display); font-size:18px; color:var(--text); margin-bottom:6px;}
  .empty-state p{font-size:13px; max-width:380px; margin:0 auto 18px; line-height:1.6;}

  .entry-card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--teal);
    border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px; cursor:pointer;
    transition:transform .12s, box-shadow .12s, background .25s, border-color .25s;
  }
  .entry-card:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,40,80,.08);}
  .entry-card.statut-en_cours{border-left-color:var(--blue);}
  .entry-card.statut-recurrent{border-left-color:var(--amber);}
  .entry-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .entry-titre{font-size:14.5px; font-weight:600; line-height:1.3;}
  .entry-date{font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0;}
  .entry-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px;}
  .badge{font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:99px;}
  .badge-systeme{background:var(--surface-2); color:var(--muted);}
  .badge-resolu{background:var(--teal-l); color:var(--teal-d);}
  .badge-en_cours{background:var(--blue-l); color:var(--blue-d);}
  .badge-recurrent{background:var(--amber-l); color:var(--amber);}
  .entry-snippet{font-family:var(--font-mono); font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ───────── Drawer ───────── */
  .scrim{position:fixed; inset:0; background:rgba(10,20,30,.45); z-index:40; display:none;}
  .scrim.show{display:block;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--surface);
    z-index:50; transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;
    box-shadow:-10px 0 30px rgba(0,0,0,.18);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .drawer-head h2{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .drawer-close{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .drawer-close svg{width:15px; height:15px;}
  .drawer-body{flex:1; overflow-y:auto; padding:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field select{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text); font-size:13.5px;
  }
  .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text); font-size:13px; font-family:var(--font-mono); resize:vertical; line-height:1.5;
  }
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-readonly{
    font-size:13.5px; line-height:1.6; white-space:pre-wrap; padding:10px 11px; background:var(--bg);
    border:1px solid var(--border); border-radius:var(--radius-sm); font-family:var(--font-mono); position:relative;
  }
  .copy-btn{
    position:absolute; top:7px; right:7px; font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:99px;
    background:var(--surface); border:1px solid var(--border); color:var(--muted); display:flex; align-items:center; gap:4px;
  }
  .copy-btn:hover{color:var(--teal-d); border-color:var(--teal);}
  .copy-btn svg{width:11px; height:11px;}
  .drawer-foot{padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:space-between;}
  .btn-primary{background:var(--teal); color:#fff; padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600;}
  .btn-primary:hover{background:var(--teal-d);}
  .btn-primary:disabled{opacity:.6; cursor:default;}
  .btn-secondary{background:var(--surface-2); color:var(--text); padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600; border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--border);}
  .btn-secondary:disabled{opacity:.6; cursor:default;}
  .btn-danger{background:transparent; color:#C5453D; padding:10px 14px; border-radius:99px; font-size:13px; font-weight:600; border:1px solid #C5453D;}
  .btn-danger:hover{background:#FBE9E7;}
  body.dark .btn-danger:hover{background:#3A1815;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--text); color:var(--bg); padding:9px 18px; border-radius:99px; font-size:12.5px; font-weight:600;
    z-index:60; transition:opacity .2s, transform .2s; pointer-events:none; max-width:80vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #importFile{display:none;}
  .help-text{font-size:12px; color:var(--muted); line-height:1.7; margin-top:6px;}
  .steps{font-size:13px; line-height:1.8; padding-left:20px; margin:10px 0;}
  .steps li{margin-bottom:6px;}

  @media(max-width:600px){
    .row-2{grid-template-columns:1fr;}
    .brand-sub{display:none;}
    .status-pill span:last-child{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 7v5l3 3"/></svg></div>
      <div>
        <div class="brand-title">Base de connaissance</div>
        <div class="brand-sub">ERREURS VBA · SIFAC</div>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un message, une cause, une correction…">
    </div>
    <div class="topbar-actions">
      <div class="status-pill" id="statusPill"><span class="status-dot"></span><span>—</span></div>
      <button class="icon-btn" id="settingsBtn" title="À propos de la connexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
      <button class="icon-btn" id="exportBtn" title="Exporter (.json)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5"/><path d="M5 19h14"/></svg>
      </button>
      <button class="icon-btn" id="importBtn" title="Importer (.json)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 19h14"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json">
      <button class="icon-btn" id="themeToggle" title="Mode sombre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button class="btn btn-light" id="newEntryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle entrée
      </button>
    </div>
  </div>
</div>

<div class="banner hidden" id="storageBanner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0z"/></svg>
  <div id="storageBannerText"></div>
</div>

<div class="filters">
  <div class="chip-row" id="systemeChips"></div>
  <select class="statut-filter" id="statutFilter">
    <option value="">Tous les statuts</option>
    <option value="resolu">Résolu</option>
    <option value="en_cours">En cours</option>
    <option value="recurrent">Récurrent</option>
  </select>
  <div class="stats" id="statsLabel"></div>
</div>

<div class="content">
  <div id="listArea"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Nouvelle entrée</h2>
    <button class="drawer-close" id="drawerClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<div class="toast" id="toast"></div>

<!-- Chargé en premier : si la page est ouverte comme Widget personnalisé Grist, cet objet permet -->
<!-- de lire/écrire directement dans le document, sans appel réseau soumis au CORS. -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>
(function(){
  var SYSTEMES = ['SIFAC','VBA — Ficher_Inj','VBA — ZSTA_DEST_WF_ACS','oHRis','Notilus','Ulysse','DigDash','Autre'];
  var STATUTS = {resolu:'Résolu', en_cours:'En cours', recurrent:'Récurrent'};
  var LOCAL_KEY = 'kb_erreurs_vba_sifac';
  var REQUIRED_COLUMNS = ['Systeme','Titre','Statut','Reference','Message','Cause','Correction','Tags','Date','UpdatedAt'];

  var entries = [];
  var filters = { search:'', systeme:'', statut:'' };
  var editingId = null;
  var backend = 'memory'; // 'grist' | 'claude' | 'local' | 'memory'
  var gristTableId = null;

  var listArea = document.getElementById('listArea');
  var systemeChips = document.getElementById('systemeChips');
  var statsLabel = document.getElementById('statsLabel');
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var drawerBody = document.getElementById('drawerBody');
  var drawerFoot = document.getElementById('drawerFoot');
  var drawerTitle = document.getElementById('drawerTitle');
  var toastEl = document.getElementById('toast');

  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso){ try{ var d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function showBanner(msg, good){
    document.getElementById('storageBannerText').innerHTML = msg;
    var b = document.getElementById('storageBanner');
    b.classList.remove('hidden');
    b.classList.toggle('good', !!good);
  }
  function hideBanner(){ document.getElementById('storageBanner').classList.add('hidden'); }

  function backendLabel(b){
    return {grist:'Grist (partagé)', claude:'Claude.ai', local:'Navigateur', memory:'Mémoire seule'}[b] || b;
  }
  function updateStatusPill(){
    var el = document.getElementById('statusPill');
    el.innerHTML = '<span class="status-dot status-dot-' + backend + '"></span><span>' + backendLabel(backend) + '</span>';
    el.title = 'Stockage actif : ' + backendLabel(backend);
  }
  function setWriteControlsEnabled(enabled){
    document.getElementById('newEntryBtn').disabled = !enabled;
  }

  /* ───────── Grist (Custom Widget — pas d'appel réseau, communication interne avec la page Grist) ───────── */
  function entryToGristFields(data, dateVal){
    return {
      Systeme:data.systeme, Titre:data.titre, Statut:data.statut, Reference:data.reference||'',
      Message:data.message||'', Cause:data.cause||'', Correction:data.correction||'',
      Tags:(data.tags||[]).join(', '), Date:dateVal, UpdatedAt:data.updatedAt
    };
  }
  function gristRecordToEntry(r){
    return {
      id:String(r.id), gristId:r.id,
      systeme:r.Systeme || SYSTEMES[0], titre:r.Titre || '(sans titre)', statut:r.Statut || 'en_cours',
      reference:r.Reference || '', message:r.Message || '', cause:r.Cause || '', correction:r.Correction || '',
      tags:(r.Tags||'').split(',').map(function(t){return t.trim();}).filter(Boolean),
      date:r.Date || new Date().toISOString(), updatedAt:r.UpdatedAt || r.Date || new Date().toISOString()
    };
  }

  function tryInitGrist(){
    return new Promise(function(resolve){
      // Pas de script Grist chargé, ou pas dans un iframe (page ouverte seule) : impossible d'être un widget Grist.
      if(typeof grist === 'undefined' || window.self === window.top){ resolve(false); return; }

      var settled = false;
      showBanner('Connexion à Grist en cours… si Grist affiche une demande d\'autorisation, acceptez l\'accès complet.');
      // Délai généreux : la première fois, Grist attend que la personne approuve manuellement l'accès complet
      // avant de répondre. Un délai trop court fait basculer l'appli sur le stockage local par erreur.
      var timer = setTimeout(function(){
        if(!settled){
          settled = true;
          showBanner('Connexion à Grist : délai dépassé (60s) sans réception de données depuis le document.');
          resolve(false);
        }
      }, 60000);

      try{
        grist.ready({ requiredAccess: 'full' });
        grist.onRecords(function(records){
          entries = (records || []).map(gristRecordToEntry);
          if(!settled){
            settled = true; clearTimeout(timer); hideBanner();
            resolve(true);
          }
          render();
        });
      }catch(e){
        if(!settled){
          settled = true; clearTimeout(timer);
          showBanner('Connexion à Grist : erreur au démarrage — ' + esc(e && e.message ? e.message : String(e)));
          resolve(false);
        }
      }
    });
  }

  /* ───────── Chargement initial (cascade Grist widget → Claude.ai → navigateur → mémoire) ───────── */
  async function loadEntries(){
    var inGrist = await tryInitGrist();
    if(inGrist){
      backend = 'grist';
      hideBanner();
      setWriteControlsEnabled(true);
      updateStatusPill();
      // les entrées arrivent via grist.onRecords (asynchrone) ; on affiche un état vide en attendant
      render();
      return;
    }

    setWriteControlsEnabled(true);

    if(window.storage && typeof window.storage.get === 'function'){
      backend = 'claude';
      try{
        var res = await window.storage.get(LOCAL_KEY, false);
        entries = (res && res.value) ? JSON.parse(res.value) : [];
      }catch(e){ entries = []; }
      updateStatusPill();
      render();
      return;
    }

    if(safeLocalStorageTest()){
      backend = 'local';
      try{
        var raw = localStorage.getItem(LOCAL_KEY);
        entries = raw ? JSON.parse(raw) : [];
      }catch(e){ entries = []; }
      updateStatusPill();
      render();
      return;
    }

    backend = 'memory';
    entries = [];
    showBanner('Aucun stockage persistant disponible ici : vos entrées resteront en mémoire pour cette seule session. Pensez à <strong>Exporter</strong> régulièrement.');
    updateStatusPill();
    render();
  }

  function safeLocalStorageTest(){
    try{ localStorage.setItem('__kb_test__','1'); localStorage.removeItem('__kb_test__'); return true; }catch(e){ return false; }
  }

  async function persistArray(){
    if(backend === 'claude'){
      try{ await window.storage.set(LOCAL_KEY, JSON.stringify(entries), false); }
      catch(e){ showToast('Erreur de sauvegarde Claude.ai'); }
    } else if(backend === 'local'){
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); }
      catch(e){ showToast('Erreur de sauvegarde locale'); }
    }
  }

  /* ───────── CRUD (routé selon le backend actif) ───────── */
  async function addEntry(data){
    var now = new Date().toISOString();
    data.updatedAt = now;
    if(backend === 'grist'){
      await grist.selectedTable.create({ fields: entryToGristFields(data, now) });
      // la liste se met à jour automatiquement via grist.onRecords
    } else {
      data.id = uid(); data.date = now;
      entries.push(data);
      await persistArray();
    }
  }

  async function updateEntry(id, data){
    var now = new Date().toISOString();
    data.updatedAt = now;
    var existing = entries.find(function(x){ return x.id === id; });
    if(backend === 'grist'){
      var fields = entryToGristFields(data, existing.date);
      var colValues = {};
      Object.keys(fields).forEach(function(k){ colValues[k] = [fields[k]]; });
      await grist.selectedTable.updateRecords(colValues, [existing.gristId]);
    } else {
      entries = entries.map(function(x){ return x.id === id ? Object.assign({}, x, data) : x; });
      await persistArray();
    }
  }

  async function deleteEntry(id){
    var existing = entries.find(function(x){ return x.id === id; });
    if(backend === 'grist' && existing){
      await grist.selectedTable.destroy(existing.gristId);
    } else {
      entries = entries.filter(function(x){ return x.id !== id; });
      await persistArray();
    }
  }

  /* ───────── Filtering ───────── */
  function filteredEntries(){
    var q = filters.search.trim().toLowerCase();
    return entries.filter(function(e){
      if(filters.systeme && e.systeme !== filters.systeme) return false;
      if(filters.statut && e.statut !== filters.statut) return false;
      if(q){
        var hay = [e.titre, e.message, e.cause, e.correction, e.reference, (e.tags||[]).join(' ')].join(' ').toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.updatedAt||b.date).localeCompare(a.updatedAt||a.date); });
  }

  /* ───────── Render ───────── */
  function renderChips(){
    var html = '<button class="chip ' + (filters.systeme===''?'active':'') + '" data-sys="">Tous</button>';
    SYSTEMES.forEach(function(s){
      html += '<button class="chip ' + (filters.systeme===s?'active':'') + '" data-sys="' + esc(s) + '">' + esc(s) + '</button>';
    });
    systemeChips.innerHTML = html;
    systemeChips.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click', function(){ filters.systeme = c.getAttribute('data-sys'); render(); });
    });
  }

  function render(){
    renderChips();
    var list = filteredEntries();
    var total = entries.length;
    var resolu = entries.filter(function(e){return e.statut==='resolu';}).length;
    var recurrent = entries.filter(function(e){return e.statut==='recurrent';}).length;
    statsLabel.textContent = total + ' entrée(s) · ' + resolu + ' résolue(s) · ' + recurrent + ' récurrente(s)';

    if(total === 0){
      listArea.innerHTML = '<div class="empty-state">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'
        + '<h2>Aucune entrée pour le moment</h2>'
        + '<p>Journalisez ici chaque erreur rencontrée sur SIFAC, vos macros VBA ou les autres systèmes : message, cause, correction. La prochaine fois, vous gagnerez du temps.</p>'
        + '<button class="btn btn-primary" id="emptyAddBtn" style="margin:0 auto;">+ Ajouter la première entrée</button>'
        + '</div>';
      var eb = document.getElementById('emptyAddBtn');
      if(eb) eb.addEventListener('click', openNewEntry);
      return;
    }

    if(list.length === 0){
      listArea.innerHTML = '<div class="empty-state"><h2>Aucun résultat</h2><p>Aucune entrée ne correspond à ces filtres.</p></div>';
      return;
    }

    listArea.innerHTML = list.map(function(e){
      var snippet = (e.message || '').replace(/\s+/g,' ').trim();
      return '<div class="entry-card statut-' + e.statut + '" data-id="' + e.id + '">'
        + '<div class="entry-top"><div class="entry-titre">' + esc(e.titre) + '</div><div class="entry-date">' + fmtDate(e.updatedAt||e.date) + '</div></div>'
        + '<div class="entry-badges">'
          + '<span class="badge badge-systeme">' + esc(e.systeme) + '</span>'
          + '<span class="badge badge-' + e.statut + '">' + STATUTS[e.statut] + '</span>'
        + '</div>'
        + (snippet ? '<div class="entry-snippet">' + esc(snippet) + '</div>' : '')
        + '</div>';
    }).join('');

    listArea.querySelectorAll('.entry-card').forEach(function(card){
      card.addEventListener('click', function(){ openDetail(card.getAttribute('data-id')); });
    });
  }

  /* ───────── Drawer: detail / edit / new / à propos ───────── */
  function closeDrawer(){
    drawer.classList.remove('open');
    scrim.classList.remove('show');
    editingId = null;
  }
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeDrawer(); });

  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('show'); }

  function openNewEntry(){
    editingId = null;
    renderForm({ systeme:SYSTEMES[0], titre:'', message:'', cause:'', correction:'', statut:'en_cours', tags:[], reference:'' });
    openDrawer();
  }
  document.getElementById('newEntryBtn').addEventListener('click', openNewEntry);

  function openDetail(id){
    var entry = entries.find(function(e){ return e.id === id; });
    if(!entry) return;
    editingId = id;
    drawerTitle.textContent = entry.titre;
    renderDetail(entry);
    openDrawer();
  }

  function renderDetail(e){
    function field(label, text, copyable){
      if(!text) return '';
      return '<div class="field"><label>' + label + '</label><div class="field-readonly">' + esc(text)
        + (copyable ? '<button class="copy-btn" data-copy="'+encodeURIComponent(text)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copier</button>' : '')
        + '</div></div>';
    }
    drawerBody.innerHTML =
      '<div class="entry-badges" style="margin-bottom:18px;">'
        + '<span class="badge badge-systeme">' + esc(e.systeme) + '</span>'
        + '<span class="badge badge-' + e.statut + '">' + STATUTS[e.statut] + '</span>'
        + (e.reference ? '<span class="badge badge-systeme">' + esc(e.reference) + '</span>' : '')
      + '</div>'
      + field('Message d\'erreur', e.message)
      + field('Cause', e.cause)
      + field('Correction appliquée', e.correction, true)
      + (e.tags && e.tags.length ? '<div class="field"><label>Tags</label><div>' + e.tags.map(function(t){return '<span class="badge badge-systeme" style="margin-right:5px;">'+esc(t)+'</span>';}).join('') + '</div></div>' : '')
      + '<div class="field"><label>Dernière mise à jour</label><div style="font-size:13px;color:var(--muted);">' + fmtDate(e.updatedAt||e.date) + '</div></div>';

    drawerBody.querySelectorAll('.copy-btn').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        copyToClipboard(decodeURIComponent(b.getAttribute('data-copy')));
      });
    });

    drawerFoot.innerHTML =
      '<button class="btn-danger" id="deleteBtn">Supprimer</button>'
      + '<div style="display:flex;gap:8px;"><button class="btn-secondary" id="editBtn">Modifier</button></div>';
    document.getElementById('editBtn').addEventListener('click', function(){ renderForm(e); });
    document.getElementById('deleteBtn').addEventListener('click', async function(){
      if(!confirm('Supprimer définitivement cette entrée ?')) return;
      var btn = this; btn.disabled = true;
      try{
        await deleteEntry(e.id);
        if(backend !== 'grist'){ render(); }
        closeDrawer();
        showToast('Entrée supprimée');
      }catch(err){
        showToast('Erreur : ' + err.message);
        btn.disabled = false;
      }
    });
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ showToast('Copié ✓'); }).catch(function(){ showToast('Copie impossible'); });
    } else {
      showToast('Copie non supportée');
    }
  }

  function renderForm(e){
    drawerTitle.textContent = editingId ? 'Modifier l\'entrée' : 'Nouvelle entrée';
    drawerBody.innerHTML =
      '<div class="field"><label>Système concerné</label><select id="f_systeme">'
        + SYSTEMES.map(function(s){ return '<option value="'+esc(s)+'" '+(e.systeme===s?'selected':'')+'>'+esc(s)+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="field"><label>Titre court</label><input type="text" id="f_titre" value="'+esc(e.titre)+'" placeholder="Ex : Erreur 9 sur ligne d\'injection ZGDU"></div>'
      + '<div class="row-2">'
        + '<div class="field"><label>Statut</label><select id="f_statut">'
          + Object.keys(STATUTS).map(function(k){ return '<option value="'+k+'" '+(e.statut===k?'selected':'')+'>'+STATUTS[k]+'</option>'; }).join('')
        + '</select></div>'
        + '<div class="field"><label>Référence (macro / cellule)</label><input type="text" id="f_reference" value="'+esc(e.reference||'')+'" placeholder="Ex : Ficher_Inj, ligne 142"></div>'
      + '</div>'
      + '<div class="field"><label>Message d\'erreur exact</label><textarea id="f_message" rows="3" placeholder="Erreur d\'exécution \'9\' : l\'indice n\'appartient pas à la sélection…">'+esc(e.message)+'</textarea></div>'
      + '<div class="field"><label>Cause identifiée</label><textarea id="f_cause" rows="3" placeholder="Ex : la feuille ZGDU contient une ligne vide non gérée par la boucle…">'+esc(e.cause)+'</textarea></div>'
      + '<div class="field"><label>Correction appliquée</label><textarea id="f_correction" rows="4" placeholder="Code ou démarche de correction…">'+esc(e.correction)+'</textarea></div>'
      + '<div class="field"><label>Tags (séparés par des virgules)</label><input type="text" id="f_tags" value="'+esc((e.tags||[]).join(', '))+'" placeholder="injection, BAL_SIFAC_ACS, contrôle"></div>';

    drawerFoot.innerHTML =
      '<div></div><div style="display:flex;gap:8px;">'
      + '<button class="btn-secondary" id="cancelBtn">Annuler</button>'
      + '<button class="btn-primary" id="saveBtn">Enregistrer</button>'
      + '</div>';

    document.getElementById('cancelBtn').addEventListener('click', function(){
      if(editingId){ openDetail(editingId); } else { closeDrawer(); }
    });

    document.getElementById('saveBtn').addEventListener('click', async function(){
      var titre = document.getElementById('f_titre').value.trim();
      if(!titre){ showToast('Le titre est obligatoire'); return; }
      var tagsRaw = document.getElementById('f_tags').value;
      var data = {
        systeme: document.getElementById('f_systeme').value,
        titre: titre,
        statut: document.getElementById('f_statut').value,
        reference: document.getElementById('f_reference').value.trim(),
        message: document.getElementById('f_message').value.trim(),
        cause: document.getElementById('f_cause').value.trim(),
        correction: document.getElementById('f_correction').value.trim(),
        tags: tagsRaw.split(',').map(function(t){return t.trim();}).filter(Boolean)
      };
      var btn = this; btn.disabled = true; var prevText = btn.textContent; btn.textContent = 'Enregistrement…';
      try{
        if(editingId){
          await updateEntry(editingId, data);
          showToast('Entrée mise à jour');
        } else {
          await addEntry(data);
          showToast('Entrée ajoutée');
        }
        if(backend !== 'grist'){ render(); }
        closeDrawer();
      }catch(err){
        showToast('Erreur : ' + err.message);
        btn.disabled = false; btn.textContent = prevText;
      }
    });
  }

  /* ───────── À propos / aide à la connexion ───────── */
  function openSettings(){
    drawerTitle.textContent = 'À propos de la connexion';
    drawerBody.innerHTML =
      '<div class="field"><label>Stockage actuellement actif</label><div style="font-size:13.5px;">' + backendLabel(backend) + '</div></div>'
      + (backend === 'grist'
          ? '<p class="help-text">Cette page tourne comme Widget personnalisé dans Grist : toutes les entrées sont lues et écrites directement dans le document, en temps réel, sans clé API ni requête réseau soumise au CORS. Toute personne ayant accès à ce document Grist voit les mêmes données.</p>'
          : '<p class="help-text">Mode hors-Grist actif : les données restent propres à cet appareil/navigateur.</p>')
      + '<div class="field" style="margin-top:18px;"><label>Pour activer le mode partagé (Grist)</label>'
        + '<ol class="steps">'
          + '<li>Hébergez ce fichier sur une URL publique (ex : GitHub Pages, comme votre widget budget).</li>'
          + '<li>Dans Grist, créez une table avec ces colonnes texte : <strong>' + REQUIRED_COLUMNS.join(', ') + '</strong>.</li>'
          + '<li>Ajoutez une page liée à cette table, puis <em>+ Ajouter un widget</em> → <em>Personnalisé (URL)</em> → collez l\'URL hébergée.</li>'
          + '<li>Quand Grist demande le niveau d\'accès, choisissez <strong>« Accès complet au document »</strong> (nécessaire pour ajouter/modifier/supprimer).</li>'
        + '</ol>'
      + '</div>'
      + '<p class="help-text">Aucune clé API n\'est utilisée : c\'est Grist qui héberge la page dans un cadre sécurisé et lui donne l\'accès, plutôt que la page qui appelle l\'API Grist depuis l\'extérieur.</p>';
    drawerFoot.innerHTML = '<div></div><div><button class="btn-secondary" id="closeSettingsBtn">Fermer</button></div>';
    document.getElementById('closeSettingsBtn').addEventListener('click', closeDrawer);
    openDrawer();
  }
  document.getElementById('settingsBtn').addEventListener('click', openSettings);

  /* ───────── Export / Import ───────── */
  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify({ exported_at:new Date().toISOString(), entries:entries }, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kb_erreurs_vba_sifac_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('Export téléchargé');
  });

  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(){
      try{
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data.entries || []);
        if(!Array.isArray(incoming)) throw new Error('format invalide');

        if(backend === 'grist'){
          if(!confirm(incoming.length + ' entrée(s) seront ajoutées comme NOUVELLES lignes dans Grist (pas de fusion automatique avec l\'existant). Continuer ?')) return;
          for(var i=0; i<incoming.length; i++){
            var e = incoming[i];
            await grist.selectedTable.create({ fields: entryToGristFields(e, e.date || new Date().toISOString()) });
          }
        } else {
          var byId = {};
          entries.forEach(function(e){ byId[e.id] = e; });
          incoming.forEach(function(e){ if(e && e.id) byId[e.id] = e; });
          entries = Object.values(byId);
          await persistArray();
          render();
        }
        showToast(incoming.length + ' entrée(s) importée(s)');
      }catch(err){
        showToast('Import impossible : ' + err.message);
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  /* ───────── Search / filter / theme ───────── */
  document.getElementById('searchInput').addEventListener('input', function(ev){ filters.search = ev.target.value; render(); });
  document.getElementById('statutFilter').addEventListener('change', function(ev){ filters.statut = ev.target.value; render(); });
  document.getElementById('themeToggle').addEventListener('click', function(){ document.body.classList.toggle('dark'); });

  setWriteControlsEnabled(false);
  loadEntries();
})();
</script>
</body>
</html>
